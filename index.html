<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halalify</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="logo">Halalify</div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#products">Products</a></li>
                <li><a href="#checkout">Checkout</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="home" class="home">
        <div class="welcome">
            <h1>Welcome to Halalify</h1>
            <p>Your one-stop destination for Shariah-compliant products.</p>
        </div>
        <div class="gallery">
            <img src="images/product 1.jpeg" alt="Product 1">
            <img src="images/product 2.jpeg" alt="Product 2">
            <img src="images/product 3.jpeg" alt="Product 3">
        </div>
    </section>

    <section id="products" class="products">
        <h2>Our Products</h2>
        <div class="filters">
            
            <button data-category="all">All</button>
            <button data-category="food">Food</button>
            <button data-category="clothing">Clothing</button>
            <button data-category="books">Books</button>
        </div>
        <div class="product-grid">
        </div>
    </section>

    <section id="checkout" class="checkout">
        <h2>Checkout</h2>
        <form id="checkout-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="address">Address:</label>
            <textarea id="address" name="address" required></textarea>

            <button type="submit">Place Order</button>
        </form>
    </section>

    <section id="contact" class="contact">
        <h2>Contact Us</h2>
        <form id="contact-form">
            <label for="query-name">Name:</label>
            <input type="text" id="query-name" name="query-name" required>

            <label for="query-email">Email:</label>
            <input type="email" id="query-email" name="query-email" required>

            <label for="query-message">Message:</label>
            <textarea id="query-message" name="query-message" required></textarea>

            <button type="submit">Submit</button>
        </form>
    </section>

    <script src="scripts.js"></script>
</body>

</html>
